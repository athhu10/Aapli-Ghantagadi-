<!-- Visitor Entry Modal -->
<div id="visitor-modal" class="modal-overlay">
    <div class="modal-content">
        <h2>स्वागत आहे! (Welcome)</h2>
        <p>तुमच्या भागातील घंटागाडी पाहण्यासाठी वॉर्ड क्रमांक टाका:</p>
        <input type="text" id="visitor-ward-input" placeholder="उदा. 101, 102...">
        <button onclick="findMyVehicle()" class="btn-search">माहिती मिळवा (Search)</button>
    </div>
</div>

<!-- Results Popup (Hidden by default) -->
<div id="result-popup" class="modal-overlay" style="display:none;">
    <div class="modal-content result-card">
        <span class="close-btn" onclick="closeResult()">&times;</span>
        <h2 id="display-ward">वॉर्ड: --</h2>
        <div class="info-row"><strong>गाडी क्र:</strong> <span id="display-veh">--</span></div>
        <div class="info-row"><strong>चालक:</strong> <span id="display-driver">--</span></div>
        <div class="info-row"><strong>संपर्क:</strong> <a id="display-link" href="">संपर्क करा</a></div>
        <hr>
        <div id="map-container">
            <!-- This will link to the live Google Map -->
             <button id="live-map-btn" class="btn-map">📍 थेट लोकेशन पहा (Live Location)</button>
        </div>
    </div>
</div>
